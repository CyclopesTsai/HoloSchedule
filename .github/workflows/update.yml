name: Update schedule

on:
  schedule:
    # Every 15 minutes, off the :00/:15/:30/:45 peaks: GitHub delays or drops
    # scheduled runs under load, worst at the top of the hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time. A newer run waits for the current one instead of cancelling
# it, so a deploy is never cut off half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      # Exits non-zero on network errors, unexpected HTML or zero items, which
      # stops the run before deploy so the last good version stays online.
      - name: Scrape schedule.hololive.tv
        run: python scripts/scrape.py --output public/data.json

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("public/data.json", encoding="utf-8"))
          live = sum(i["is_live"] for i in d["items"])
          print(f"generated_at `{d['generated_at']}` · {len(d['items'])} items · {live} live")
          PY

      # Pages caches everything for 10 minutes and allows no custom headers;
      # versioned CSS/JS URLs make browsers fetch new code right after a deploy.
      - name: Version CSS/JS URLs
        run: python scripts/stamp_assets.py public

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
