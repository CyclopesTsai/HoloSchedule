<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>hololive 直播節目表（非官方）</title>
  <meta name="description" content="非官方 hololive 直播節目表，資料取自ホロジュール（schedule.hololive.tv），每 15 分鐘更新。">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#5d4037">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2329a8e0'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="title-row">
        <h1>hololive 直播節目表</h1>
        <span class="unofficial">非官方</span>
        <p class="status" id="status" aria-live="polite">讀取中…</p>
      </div>
      <nav class="filter-bar" aria-label="依團體篩選">
        <div class="chips" id="groups" role="group" aria-label="團體"></div>
        <button type="button" class="gear" id="chip-settings-btn" aria-label="設定"
                aria-haspopup="true" aria-expanded="false" aria-controls="chip-settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </nav>
      <div class="chip-settings" id="chip-settings" hidden>
        <div class="setting">
          <label for="tz">時區</label>
          <select id="tz">
            <option value="Asia/Taipei">台北時間</option>
            <option value="Asia/Tokyo">東京時間</option>
            <option value="local">瀏覽器本地</option>
          </select>
        </div>
        <label class="toggle setting">
          <input type="checkbox" id="hide-ended">
          <span>隱藏已結束的節目</span>
        </label>
        <p class="chip-settings-title">要顯示的團體</p>
        <div id="chip-settings-list"></div>
        <p class="chip-settings-note">未勾選的團體不會出現在清單中（包含「全部」）。</p>
        <p class="chip-settings-note">點擊節目會在右側播放影片與聊天室；⌘／Ctrl＋點擊或中鍵則在新分頁開啟 YouTube。</p>
      </div>
    </div>
  </header>

  <main class="paper" id="main">
    <div id="days"></div>
    <p class="empty" id="empty" hidden>沒有符合條件的節目。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>資料來源：<a href="https://schedule.hololive.tv/" target="_blank" rel="noopener noreferrer">ホロジュール（schedule.hololive.tv）</a></p>
      <p>本站為個人製作的<strong>非官方</strong>頁面，與 COVER 株式会社及 hololive production 無關。資料可能有誤，請以原站為準。節目資料版權屬原站與各權利人，僅供個人參考，請勿商用。</p>
      <p>本站程式碼以 <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener noreferrer">GNU AGPL-3.0</a> 授權，<a href="https://github.com/CyclopesTsai/HoloSchedule" target="_blank" rel="noopener noreferrer">原始碼在 GitHub</a>。</p>
    </div>
  </footer>

  <!-- Side player. Iframes are created on open
       and removed on close so nothing keeps playing or loading in the background. -->
  <aside class="player" id="player" hidden aria-label="節目播放器">
    <div class="player-resizer" id="player-resizer" role="separator" tabindex="0"
         aria-orientation="vertical" aria-label="調整播放器寬度（拖曳或左右鍵，雙擊還原）"></div>
    <div class="player-head">
      <div class="player-info">
        <strong id="player-member"></strong>
        <span id="player-title"></span>
        <span id="player-status" class="player-status" aria-live="polite"></span>
      </div>
      <a class="player-btn" id="player-yt" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
      <button type="button" class="player-btn player-close" id="player-close" aria-label="關閉播放器">✕</button>
    </div>
    <div class="player-video" id="player-video"></div>
    <div class="player-chat" id="player-chat"></div>
  </aside>

  <template id="entry-tpl">
    <li class="entry">
      <a class="entry-link" target="_blank" rel="noopener noreferrer">
        <time class="time"></time>
        <div class="thumb">
          <img alt="" loading="lazy" decoding="async" width="320" height="180">
        </div>
        <div class="info">
          <div class="who">
            <span class="member"></span>
            <span class="group"></span>
          </div>
          <span class="stream-title"></span>
        </div>
        <span class="badge badge-live">LIVE</span>
        <span class="badge badge-soon"></span>
      </a>
    </li>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
