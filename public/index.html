<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>hololive 直播節目表（非官方）</title>
  <meta name="description" content="非官方 hololive 直播節目表，資料取自ホロジュール（schedule.hololive.tv），每 15 分鐘更新。">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2329a8e0'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    try {
      var t = JSON.parse(localStorage.getItem("holoschedule:prefs") || "{}").theme;
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="header-row">
        <div>
          <div class="title-row">
            <h1>hololive 直播節目表</h1>
            <span class="unofficial">非官方</span>
          </div>
          <p class="status" id="status" aria-live="polite">讀取中…</p>
        </div>
        <div class="settings">
          <label class="tz">
            <span class="visually-hidden">時區</span>
            <select id="tz">
              <option value="Asia/Taipei">台北時間</option>
              <option value="Asia/Tokyo">東京時間</option>
              <option value="local">瀏覽器本地</option>
            </select>
          </label>
          <label class="theme">
            <span class="visually-hidden">外觀</span>
            <select id="theme">
              <option value="system">跟隨系統</option>
              <option value="light">淺色模式</option>
              <option value="dark">深色模式</option>
            </select>
          </label>
          <label class="toggle">
            <input type="checkbox" id="hide-ended">
            <span>隱藏已結束</span>
          </label>
        </div>
      </div>
      <p class="stale" id="stale" hidden>⚠️ 資料可能已過期（超過 1 小時未更新），請以<a href="https://schedule.hololive.tv/" target="_blank" rel="noopener noreferrer">原站</a>為準。</p>
    </div>
  </header>

  <nav class="controls" aria-label="依團體篩選">
    <div class="wrap">
      <div class="filter-bar">
        <div class="chips" id="groups" role="group" aria-label="團體"></div>
        <button type="button" class="gear" id="chip-settings-btn" aria-label="設定要顯示的篩選按鈕"
                aria-haspopup="true" aria-expanded="false" aria-controls="chip-settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
      <div class="chip-settings" id="chip-settings" hidden>
        <p class="chip-settings-title">顯示哪些篩選按鈕</p>
        <div id="chip-settings-list"></div>
        <p class="chip-settings-note">未勾選的團體仍會出現在「全部」中。</p>
      </div>
    </div>
  </nav>

  <main class="wrap" id="main">
    <div id="days"></div>
    <p class="empty" id="empty" hidden>沒有符合條件的節目。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>資料來源：<a href="https://schedule.hololive.tv/" target="_blank" rel="noopener noreferrer">ホロジュール（schedule.hololive.tv）</a></p>
      <p>本站為個人製作的<strong>非官方</strong>頁面，與 COVER 株式会社及 hololive production 無關。資料可能有誤，請以原站為準。僅供個人使用，不得商用。</p>
      <p><a href="https://github.com/CyclopesTsai/HoloSchedule" target="_blank" rel="noopener noreferrer">原始碼（GitHub）</a></p>
    </div>
  </footer>

  <template id="entry-tpl">
    <li class="entry">
      <a class="entry-link" target="_blank" rel="noopener noreferrer">
        <time class="time"></time>
        <div class="thumb">
          <img alt="" loading="lazy" decoding="async" width="320" height="180">
        </div>
        <div class="info">
          <span class="member"></span>
          <span class="group"></span>
        </div>
        <span class="badge badge-live">LIVE</span>
        <span class="badge badge-soon"></span>
      </a>
    </li>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
